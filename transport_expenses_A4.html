<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>交通費明細</title><style>body{font-family:system-ui,sans-serif;background:#f3f6fa;color:#172337;margin:0}main{max-width:680px;margin:auto;padding:16px}h1{font-size:23px}section{background:white;border-radius:12px;padding:16px;margin:12px 0;box-shadow:0 1px 4px #0001}label{display:block;font-weight:600;margin:10px 0 4px}input,textarea{box-sizing:border-box;width:100%;padding:12px;font:inherit;border:1px solid #bcc8d5;border-radius:8px}textarea{min-height:55px}button{border:0;background:#165aa6;color:white;padding:12px;border-radius:8px;font:inherit;cursor:pointer;margin:4px 4px 4px 0}.sub{background:#e5edf6;color:#183b64}.danger{background:#a42b32}.line{border-top:1px solid #ddd;padding:12px 0}.small{font-size:13px;color:#526174}.sum{font-size:20px;font-weight:700}.row{display:flex;gap:10px}.row>*{flex:1;min-width:0}@media print{.no-print,button,#entryForm{display:none!important}body{background:white}section{box-shadow:none;border:1px solid #ddd}main{max-width:none}} #printEntries{display:none}@page{size:A4 portrait;margin:9mm 10mm}@media print{html,body{width:100%;margin:0;padding:0;font-size:9px;color:#000}main{padding:0;max-width:none}h1{font-size:16px;margin:0 0 5px}h2{font-size:11px;margin:0 0 5px}section{margin:0 0 5px;padding:4px;border:0;border-radius:0;box-shadow:none;break-inside:auto}section:first-of-type{display:flex;align-items:center;gap:8px;flex-wrap:wrap}section:first-of-type label{margin:0;font-size:10px}#worker,#month{width:auto;max-width:145px;padding:2px;border:0;border-bottom:1px solid #888;border-radius:0;font-size:10px;background:transparent}section:first-of-type p{display:none}#entries{display:none!important}#printEntries{display:block!important}#printEntries table{width:100%;border-collapse:collapse;table-layout:fixed;font-size:8px}#printEntries th,#printEntries td{border:1px solid #888;padding:3px;vertical-align:top;overflow-wrap:anywhere;line-height:1.2}#printEntries th{background:#eee}#printEntries tr{break-inside:avoid}.sum{font-size:11px;margin:2px 0 6px}.line{display:grid;grid-template-columns:110px 1fr 100px 65px;gap:4px;align-items:start;padding:3px 2px;border-top:1px solid #aaa;break-inside:avoid;font-size:8px;line-height:1.2}.line b{font-size:8px}.line>div{overflow-wrap:anywhere}.line .small{font-size:7px}.no-print,button,#entryForm{display:none!important}#entries{margin:0}#entries .line:last-child{border-bottom:1px solid #aaa}} </style></head><body><main><h1>交通費明細</h1><section><label for="worker">作業者名</label><input id="worker" placeholder="氏名"><label for="month">対象月</label><input type="month" id="month"><p class="small">入力内容はこの端末のブラウザ内に一時保存されます。定期的にバックアップしてください。</p></section><section class="no-print"><h2>交通費を入力</h2><form id="entryForm"><div class="row"><div><label for="date">日付</label><input type="date" id="date" required></div><div><label for="amount">往復金額（円）</label><input type="number" id="amount" min="0" step="1" required></div></div><label for="site">現場名</label><input id="site" required><label for="route">交通ルート（往復）</label><textarea id="route" required placeholder="例：八王子駅 ⇔ 新宿駅"></textarea><label for="memo">メモ・手当</label><textarea id="memo"></textarea><button type="submit" id="save">この日付で保存</button><button type="button" class="sub" id="copy">前回の内容をコピー</button><button type="button" class="sub" id="reset">入力をクリア</button></form><p class="small">同じ現場に複数日通った場合は、下の「複数日登録」が便利です。</p><details><summary>同じ内容で複数日登録</summary><p class="small">上の現場・ルート・金額を使います。日付をカンマまたは改行で区切って入力してください（例：1,2,5,8）。対象月の日付として登録します。</p><textarea id="days" placeholder="1,2,5,8"></textarea><button type="button" id="batch">指定した日付にまとめて登録</button></details></section><section><h2>月別一覧</h2><div class="sum" id="totals"></div><div id="entries"></div><div id="printEntries"></div></section><section class="no-print"><h2>提出・バックアップ</h2><button id="print">印刷 / PDF保存</button><button class="sub" id="export">バックアップ保存</button><label for="import">バックアップを読み込む（JSON）</label><input id="import" type="file" accept="application/json,.json"><p class="small">PDFを保存したら、スマホの共有機能で会社に送信してください。バックアップファイルには氏名や移動経路が含まれます。取り扱いに注意してください。</p></section></main><script>
(()=>{'use strict';const $=id=>document.getElementById(id),KEY='ths_transport_v1';let data={worker:'',entries:[]},editing=null;try{let d=JSON.parse(localStorage.getItem(KEY));if(d&&Array.isArray(d.entries))data=d}catch(e){}const today=new Date(),ym=`${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}`;$('month').value=ym;$('date').value=`${ym}-${String(today.getDate()).padStart(2,'0')}`;$('worker').value=data.worker||'';function persist(){data.worker=$('worker').value;try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){alert('保存できません。バックアップを作成してください。')}}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function validDate(s){if(!/^\d{4}-\d{2}-\d{2}$/.test(s))return false;let d=new Date(s+'T12:00:00');return !isNaN(d)&&`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`===s}function fields(){let date=$('date').value,amount=Number($('amount').value);if(!validDate(date)||!$('site').value.trim()||!$('route').value.trim()||$('amount').value===''||!Number.isSafeInteger(amount)||amount<0){alert('日付・現場・ルート・金額を正しく入力してください。');return null}return {date,site:$('site').value.trim(),route:$('route').value.trim(),amount,memo:$('memo').value.trim()}}function render(){let rows=data.entries.filter(x=>x.date.startsWith($('month').value+'-')).sort((a,b)=>a.date.localeCompare(b.date)),total=rows.reduce((s,x)=>s+x.amount,0),days=new Set(rows.map(x=>x.date)).size;$('totals').textContent=`出勤日数 ${days}日 ／ 合計 ${total.toLocaleString('ja-JP')}円`;$('printEntries').innerHTML='<table><thead><tr><th style="width:12%">日付</th><th style="width:22%">現場名</th><th style="width:36%">往復ルート</th><th style="width:12%">金額</th><th style="width:18%">メモ</th></tr></thead><tbody>'+rows.map(x=>'<tr><td>'+esc(x.date.slice(5))+'（'+ '日月火水木金土'[new Date(x.date+'T12:00:00').getDay()]+'）</td><td>'+esc(x.site)+'</td><td>'+esc(x.route)+'</td><td style="text-align:right">'+Number(x.amount).toLocaleString('ja-JP')+'円</td><td>'+esc(x.memo)+'</td></tr>').join('')+'</tbody></table>'; $('entries').innerHTML=rows.length?rows.map(x=>`<div class="line"><b>${esc(x.date)}（${'日月火水木金土'[new Date(x.date+'T12:00:00').getDay()]}）</b>　<b>${Number(x.amount).toLocaleString('ja-JP')}円</b><div>${esc(x.site)}</div><div>${esc(x.route)}</div>${x.memo?`<div class="small">${esc(x.memo)}</div>`:''}<div class="no-print"><button class="sub" data-act="edit" data-id="${esc(x.id)}">編集</button><button class="sub" data-act="copy" data-id="${esc(x.id)}">コピー</button><button class="danger" data-act="delete" data-id="${esc(x.id)}">削除</button></div></div>`).join(''):'<p class="small">この月の登録はありません。</p>'}function fill(x,copy){$('date').value=copy?$('date').value:x.date;$('site').value=x.site;$('route').value=x.route;$('amount').value=x.amount;$('memo').value=x.memo||'';editing=copy?null:x.id;$('save').textContent=copy?'この日付で保存':'変更を保存';if(!copy)window.scrollTo(0,0)}function clear(){editing=null;$('entryForm').reset();$('date').value=$('month').value+'-01';$('save').textContent='この日付で保存'}$('worker').addEventListener('input',persist);$('month').addEventListener('change',()=>{clear();render()});$('entryForm').addEventListener('submit',e=>{e.preventDefault();let x=fields();if(!x)return;if(editing){let i=data.entries.findIndex(y=>y.id===editing);if(i>=0)data.entries[i]={...x,id:editing}}else data.entries.push({...x,id:crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random()});persist();$('month').value=x.date.slice(0,7);render();clear()});$('entries').addEventListener('click',e=>{let b=e.target.closest('button[data-act]');if(!b)return;let x=data.entries.find(z=>z.id===b.dataset.id);if(!x)return;if(b.dataset.act==='delete'){if(confirm('この明細を削除しますか？')){data.entries=data.entries.filter(z=>z.id!==x.id);persist();render()}}else fill(x,b.dataset.act==='copy')});$('copy').onclick=()=>{let x=[...data.entries].sort((a,b)=>b.date.localeCompare(a.date))[0];if(!x)return alert('コピーする明細がまだありません。');fill(x,true)};$('reset').onclick=clear;$('batch').onclick=()=>{let base=fields();if(!base)return;let raw=$('days').value.trim().split(/[,、\s]+/).filter(Boolean),month=$('month').value;if(!raw.length)return alert('日付を入力してください。');let dates=raw.map(n=>`${month}-${String(Number(n)).padStart(2,'0')}`);if(dates.some((d,i)=>!/^\d{1,2}$/.test(raw[i])||!validDate(d)))return alert('対象月の正しい日付を入力してください。');dates=[...new Set(dates)];if(!confirm(`${dates.length}日分を登録します。よろしいですか？`))return;dates.forEach(date=>data.entries.push({...base,date,id:String(Date.now())+Math.random()}));persist();render();alert(`${dates.length}日分を登録しました`)};$('print').onclick=()=>window.print();$('export').onclick=()=>{persist();let blob=new Blob([JSON.stringify({format:'ths_transport_v1',...data},null,2)],{type:'application/json'}),a=document.createElement('a'),url=URL.createObjectURL(blob);a.href=url;a.download=`交通費バックアップ_${new Date().toISOString().slice(0,10)}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};$('import').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{let obj=JSON.parse(await f.text());if(!Array.isArray(obj.entries)||obj.entries.some(x=>!validDate(x.date)||typeof x.site!=='string'||typeof x.route!=='string'||!Number.isSafeInteger(x.amount)||x.amount<0))throw Error('形式が正しくありません');if(!confirm('現在の全データをバックアップ内容で置き換えます。よろしいですか？'))return;data={worker:String(obj.worker||''),entries:obj.entries.map(x=>({...x,id:String(x.id||Date.now()+Math.random())}))};$('worker').value=data.worker;persist();render();alert('読み込みました')}catch(err){alert('バックアップを読み込めませんでした：'+err.message)}finally{e.target.value=''}};render()})();
</script></body></html>
